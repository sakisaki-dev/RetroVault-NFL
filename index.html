    <!-- Pre-JS splash: inline CSS and HTML only (no font, image or stylesheet), painted with the first bytes of the page. Nothing

    <style>
      html,body{background:#080c18;margin:0}
      #rv-boot{position:fixed;inset:0;z-index:2147483000;background:#080c18;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease-in .35s;perspective:700px}
