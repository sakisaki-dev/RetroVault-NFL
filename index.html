    <!-- Pre-JS splash: inline CSS and HTML only (no font, image or stylesheet), painted with the first bytes of the page. Nothing
         render-blocking sits before it: the Google Fonts sheet below loads without blocking (media swap) and the build makes
         the app's own stylesheet non-blocking too (vite.config.ts). main.tsx calls __rvBootDone() after React's first commit
         and once the stylesheet is in; the vault door then rolls open (the inline script below draws it on a canvas). If the script never arrives, it says so after 12 s. -->
    <style>
      html,body{background:#111627;margin:0}
      #rv-boot{position:fixed;inset:0;z-index:2147483000;background:#111627;overflow:hidden}
      #rv-boot.fade{opacity:0;transition:opacity .25s ease-out}
      #rv-boot.roll{pointer-events:none}
      #rv-cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
      #rv-boot p{position:absolute;left:24px;right:24px;bottom:calc(10% + env(safe-area-inset-bottom,0px));margin:0;font:500 13px/1.4 -apple-system,system-ui,sans-serif;color:#9aa4bd;text-align:center;opacity:0;transition:opacity .4s;text-shadow:0 1px 3px #050810}
      #rv-boot p.on{opacity:1}
      #rv-boot button{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10% - 50px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 22px;border:0;border-radius:8px;background:#ffc83d;color:#000;font:800 15px -apple-system,system-ui,sans-serif;text-transform:uppercase}
      #rv-boot button.on{display:block}
    </style>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" /></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://a.espncdn.com" />

  </head>

  <body>
    <div id="rv-boot" role="status" aria-label="Loading"><canvas id="rv-cv"></canvas><p id="rv-boot-msg"></p><button id="rv-boot-btn" type="button" onclick="location.reload()">Tap to reload</button></div>
    <div id="root"></div>
    <script>
      (function(){
        var b=document.getElementById("rv-boot"),cv=document.getElementById("rv-cv"),m=document.getElementById("rv-boot-msg"),k=document.getElementById("rv-boot-btn"),root=document.getElementById("root");
        var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
        var t0=performance.now(),ready=false,openAt=-1,gone=false,raf=0,ctx=cv.getContext("2d");
        function say(x,btn){m.textContent=x;m.className="on";if(btn)k.className="on"}
        setTimeout(function(){if(!ready)say("Slow connection, still loading")},5000);
        setTimeout(function(){if(!ready)say("Still can’t load. Check your connection and try again.",1)},20000);
        /* palette (CLAUDE.md "Home Screen app" art: the site's navy / gold) */
        function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
        var P={},PS={ol:"#050810",hi:"#3d4f80",body:"#243153",ring:"#2f3d66",shine:"#5d6f9c",low:"#46567f",gold:"#ffc83d",goldd:"#c98a12",goldl:"#fff1c4",silver:"#a9b8dd",wall:"#111627",wall2:"#0c1121",rivet:"#2f3d66",track:"#1a2137"};
        for(var n in PS)P[n]=hx(PS[n]);
        var BAYER=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
        var RAMP=["#0b0f1d","#2a1a06","#6b420b","#b8790f","#ffc83d","#ffe39a","#fff6dc","#fffdf6"].map(hx);
        function clamp(v,a,c){return v<a?a:v>c?c:v}
        function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
        function easeIn(t){return t*t*t}
        function easeOut(t){return 1-Math.pow(1-t,3)}
        function seg(t,a,c){return clamp((t-a)/(c-a),0,1)}
        var spokeA=[0,1,2,3,4,5].map(function(j){return j*Math.PI/3-Math.PI/2});
        var W,H,PX,cx,cy,R,img,d,last="";
        function size(){
          var w=b.clientWidth||innerWidth,h=b.clientHeight||innerHeight;
          PX=w>=768?4:3;W=Math.max(40,Math.round(w/PX));H=Math.max(40,Math.round(h/PX));
          cv.width=W;cv.height=H;img=ctx.createImageData(W,H);d=img.data;last="";
          cx=W/2;cy=H*(W<H?.47:.5);R=Math.round(W<H?W*.43:Math.min(W*.3,H*.4));
        }
        function face(u,v,wa,boltIn){
          var r=Math.hypot(u,v),i,a;
          if(r>R-5&&r<R+3-boltIn){
            var ang=Math.atan2(v,u)+Math.PI/12,kk=Math.round(ang/(Math.PI/6))*(Math.PI/6),perp=Math.abs(r*Math.sin(ang-kk));
            if(perp<1.9&&r>R-.5)return perp<.9?P.gold:P.goldd;
          }
          if(r>R)return null;
          if(r>R-1)return P.ol;
          var s=(-u-v)/R;
          if(r>R-4)return s>.5?P.hi:P.ring;
          var g=R*.68;
          if(r>g+2)return s>.55?P.ring:P.body;
          if(r>g+1)return P.hi;
          if(r>g)return P.ol;
          var c=Math.cos(-wa),sn=Math.sin(-wa),p=u*c-v*sn,q=u*sn+v*c,wr=R*.42;
          for(i=0;i<6;i++){a=spokeA[i];
            var kx=(wr+3.2)*Math.cos(a),ky=(wr+3.2)*Math.sin(a),kd=Math.hypot(p-kx,q-ky);
            if(kd<2.6)return kd<1.2&&(p-kx+q-ky)<0?P.goldl:(kd<2?P.gold:P.ol);
          }
          if(r<2)return P.ol;
          if(r<3.5)return P.goldd;
          if(r<5.2)return P.gold;
          if(r<6.2)return P.ol;
          if(Math.abs(r-wr)<1.3)return P.silver;
          if(Math.abs(r-wr)<2)return P.ol;
          if(r<wr)for(i=0;i<6;i++){a=spokeA[i];
            var al=p*Math.cos(a)+q*Math.sin(a),pp=Math.abs(-p*Math.sin(a)+q*Math.cos(a));
            if(al>0&&pp<1)return P.silver;
            if(al>0&&pp<1.7)return P.ol;
          }
          return s>0?P.shine:P.low;
        }
        function wall(x,y,u,v,r){
          if(r<=R+1)return P.ol;
          if(r<=R+2)return P.silver;
          if(r<=R+5)return P.ring;
          if(r<=R+6)return P.ol;
          if(Math.abs(v-R)<1)return P.ol;
          if(v>R&&v<R+3&&u<0)return P.track;
          var gx=((x%12)+12)%12,gy=((y%12)+12)%12;
          if(gx===6&&gy===6)return P.rivet;
          return(Math.floor(x/12)+Math.floor(y/12))%2?P.wall:P.wall2;
        }
        function ramp(bb,x,y){bb+=(BAYER[((y&7)<<3)+(x&7)]/64-.5)*.16;return RAMP[clamp(Math.floor(bb*RAMP.length),0,RAMP.length-1)]}
        function lightIn(x,y,u,v,r,L,t){
          var ang=Math.atan2(v,u)+t*.00035;
          return ramp(L*(1.25-(r/R)*.95)+(Math.cos(ang*9)>.55?.14*L:0),x,y);
        }
        var WA_STEP=Math.PI/20,wa0=0;
        /* o = ms since the open began (negative while idling); idle ticks the wheel one step every 170 ms */
        function draw(t,o,sc){
          var wa=o<0?-Math.floor(t/170)*WA_STEP:wa0-ease(seg(o,0,700))*Math.PI*2.2;
          var boltIn=seg(o,520,760)*4;
          var push=1+.05*easeOut(seg(o,760,980));
          var rollX=-ease(seg(o,1050,2000))*(R*2.6),rho=rollX/R;
          var L=o<760?0:.16*seg(o,760,1000)+.14*seg(o,1100,1800);
          var z=1+easeIn(seg(o,1650,2200))*1.2;
          /* owner: no yellow wash at the end: the vault fades to black, then the page animates in */
          var blk=1-easeIn(seg(o,1650,2150)),disA=2150;
          var cr=Math.cos(-rho),sr=Math.sin(-rho);
          for(var y=0;y<H;y++)for(var x=0;x<W;x++){
            var i=(y*W+x)*4;
            var sx=(x+.5-cx)/z+cx,sy=(y+.5-cy)/z+cy,u=sx-cx,v=sy-cy,r=Math.hypot(u,v),shade=1;
            var du=(u-rollX)/push,dv=v/push;
            var col=face(du*cr-dv*sr,du*sr+dv*cr,wa,boltIn);
            if(col){if(o>760&&o<1000)shade=1.08}
            else if(r<R+.01)col=lightIn(x,y,u,v,r,L,o<0?0:o);
            else col=wall(Math.floor(sx),Math.floor(sy),u,v,r);
            shade*=blk;d[i]=Math.min(255,col[0]*shade);d[i+1]=Math.min(255,col[1]*shade);d[i+2]=Math.min(255,col[2]*shade);d[i+3]=255;
          }
          ctx.putImageData(img,0,0);
          return disA;
        }
        function finish(){
          if(gone)return;gone=true;cancelAnimationFrame(raf);
          root.style.transform="";root.style.filter="";root.style.transformOrigin="";
          if(b.parentNode)b.parentNode.removeChild(b);cv.width=cv.height=0;
          removeEventListener("resize",onResize);
        }
        function frame(now){
          if(gone)return;
          var t=now-t0,TS=.85;
          if(openAt<0&&ready&&t>=500){openAt=t;wa0=-Math.floor(t/170)*WA_STEP}
          if(openAt<0){
            var key=Math.floor(t/170)+"|"+W+"x"+H;
            if(key!==last){last=key;draw(t,-1,1)}
            raf=requestAnimationFrame(frame);return;
          }
          var o=(t-openAt)/TS;
          if(o>1050)b.className="roll";
          if(o>1050)m.className=k.className="";
          var disA=draw(t,o,TS);
          if(o>=disA){
            var p=ease(seg(o,disA,disA+600));
            b.style.opacity=String(1-p);
            root.style.transformOrigin="50% 30%";root.style.transform="translateY("+(16*(1-p)).toFixed(2)+"px) scale("+(.985+.015*p).toFixed(4)+")";
          }
          if(o>=disA+650){finish();return}
          raf=requestAnimationFrame(frame);
        }
        var rt;function onResize(){clearTimeout(rt);rt=setTimeout(function(){if(!gone)size()},100)}
        function fadeOut(){
          if(gone)return;cancelAnimationFrame(raf);m.className=k.className="";b.className="roll fade";
          setTimeout(finish,300);
        }
        function open(){ready=true;if(reduce)setTimeout(fadeOut,0)}
        size();addEventListener("resize",onResize);
        draw(0,-1,1);last=Math.floor(0)+"|"+W+"x"+H;if(!reduce)raf=requestAnimationFrame(frame);
        window.__rvBootDone=function(){
          if(ready)return;
          var l=document.querySelector("link[data-app-css]");
          if(!l||l.dataset.ok){open();return}
          l.addEventListener("load",open);l.addEventListener("error",open);setTimeout(open,15000)
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
