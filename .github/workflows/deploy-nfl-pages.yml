# NFL edition: builds the site and publishes it to GitHub Pages (https://sakisaki-dev.github.io/RetroVault-NFL/)
# on every push to main in github.com/sakisaki-dev/RetroVault-NFL. The guard keeps it from running anywhere else
# (the Retro Bowl repo shares this history). One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy NFL edition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nfl-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'sakisaki-dev/RetroVault-NFL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EDITION: nfl
          BASE_PATH: /RetroVault-NFL/
          # No /espn-content proxy on Pages: the News reader shows the summary and a "Read on ESPN" link
          VITE_STATIC_HOST: "1"
      # The widget (Scriptable, iPhone): widget.json is kept on the widget-data branch by nfl-widget-daily.yml, so main's
      # pushes and the bot's data never collide; it is copied in here, at /widget/widget.json, beside the widget's code
      - name: Add the widget data
        run: |
          mkdir -p dist/widget
          cp public/widgets/rv-nfl-widget.js public/widgets/rv-nfl-install.js dist/widget/
          if git fetch --depth 1 origin widget-data; then
            git show FETCH_HEAD:widget.json > dist/widget/widget.json
          else
            echo "::warning::no widget-data branch: /widget/widget.json is not served"
          fi
      # The site's live-season files (This season, fantasy and the trade simulator, injuries, playoff odds, depth charts) are
      # rebuilt every morning by nfl-widget-daily.yml and kept on widget-data under site/nfl/. They go over main's copies
      # (the fallback) in dist, and their data/manifest.json versions are updated so the data store refetches them. Main's
      # files stay when a hand rebuild pushed to main is newer (overlay_live.py compares season and week).
      - name: Add the live-season data
        run: |
          if git fetch --depth 1 origin widget-data; then
            rm -rf /tmp/live && mkdir -p /tmp/live
            git archive FETCH_HEAD site/nfl | tar -x -C /tmp/live || true
            python3 scripts/nfl/overlay_live.py /tmp/live/site/nfl dist
          else
            echo "::warning::no widget-data branch: main's live-season files are served"
          fi
      # Deep links fall back to the app instead of GitHub's 404 page
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
